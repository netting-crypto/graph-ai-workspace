<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Graph AI Workspace</title>
  <desc id="desc">A Canvas-first workspace connecting knowledge cards, question context, conversations, and local AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#151329"/><stop offset="1" stop-color="#292052"/></linearGradient>
    <linearGradient id="glow" x1="160" y1="70" x2="1050" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#05040D" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="50" r="170" fill="#8B5CF6" opacity=".12"/><circle cx="115" cy="390" r="190" fill="#22D3EE" opacity=".08"/>
  <path d="M105 285C235 195 265 118 410 150C530 176 545 298 685 260C810 226 824 105 1002 130" stroke="url(#glow)" stroke-width="2" stroke-dasharray="7 10" opacity=".8"/>
  <path d="M410 150L685 260M685 260L1002 130" stroke="#A78BFA" stroke-width="1.5" opacity=".38"/>
  <g filter="url(#shadow)">
    <rect x="64" y="72" width="410" height="112" rx="16" fill="#211C3D" stroke="#8B5CF6" stroke-opacity=".65"/>
    <text x="94" y="112" fill="#C4B5FD" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" font-weight="700" letter-spacing="2">OBSIDIAN PLUGIN</text>
    <text x="92" y="151" fill="white" font-family="Inter,ui-sans-serif,sans-serif" font-size="31" font-weight="750">Graph AI Workspace</text>
    <text x="94" y="174" fill="#C4B5FD" font-family="Inter,ui-sans-serif,sans-serif" font-size="14">Think on Canvas. Ask with context. Keep the result.</text>
    <rect x="772" y="72" width="356" height="112" rx="16" fill="#172B3C" stroke="#22D3EE" stroke-opacity=".6"/>
    <text x="802" y="111" fill="#67E8F9" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOCAL-FIRST CONTROL</text>
    <text x="802" y="148" fill="white" font-family="Inter,ui-sans-serif,sans-serif" font-size="22" font-weight="700">Your vault, your branches</text>
    <text x="802" y="172" fill="#A5F3FC" font-family="Inter,ui-sans-serif,sans-serif" font-size="14">Explicit context · explicit materialization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="92" y="247" width="190" height="94" rx="14" fill="#242044" stroke="#A78BFA"/>
    <text x="116" y="281" fill="#C4B5FD" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="700">01 / CANVAS</text><text x="116" y="312" fill="white" font-family="Inter,ui-sans-serif,sans-serif" font-size="20" font-weight="700">Knowledge cards</text>
    <rect x="315" y="105" width="190" height="94" rx="14" fill="#242044" stroke="#A78BFA"/>
    <text x="339" y="139" fill="#C4B5FD" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="700">02 / CONTEXT</text><text x="339" y="170" fill="white" font-family="Inter,ui-sans-serif,sans-serif" font-size="20" font-weight="700">Question scope</text>
    <rect x="590" y="218" width="190" height="94" rx="14" fill="#1D3545" stroke="#67E8F9"/>
    <text x="614" y="252" fill="#A5F3FC" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="700">03 / DIALOGUE</text><text x="614" y="283" fill="white" font-family="Inter,ui-sans-serif,sans-serif" font-size="20" font-weight="700">Forked thinking</text>
    <rect x="865" y="105" width="190" height="94" rx="14" fill="#1D3545" stroke="#67E8F9"/>
    <text x="889" y="139" fill="#A5F3FC" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="700">04 / AGENT</text><text x="889" y="170" fill="white" font-family="Inter,ui-sans-serif,sans-serif" font-size="20" font-weight="700">Answer + act</text>
  </g>
  <text x="64" y="391" fill="#A5B4FC" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">CANVAS → CONTEXT → CONVERSATION → AGENT → CANVAS</text>
</svg>
