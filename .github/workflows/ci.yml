name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check source and release metadata
        run: npm run check

      - name: Build bundled Obsidian plugin
        run: npm run build

      - name: Verify bundled main.js
        run: node --check dist/main.js
